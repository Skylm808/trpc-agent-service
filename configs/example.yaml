schema_version: 1
tenants:
  - tenant_id: demo
    name: Demo Tenant
    enabled: true
    config_version: 1
    audit:
      enabled: true
      retention_days: 30
      store_content: false
      redact_fields:
        - authorization
        - api_key
    apps:
      - app_id: assistant
        name: Demo Assistant
        enabled: true
        config:
          instruction: You are a helpful assistant for the demo tenant.
        model:
          provider: deepseek
          name: deepseek-v4-flash
          base_url: https://api.deepseek.com
          api_key:
            provider: env
            key: DEEPSEEK_API_KEY
          temperature: 0
          max_tokens: 2048
        tools:
          allow:
            - calculator
          deny:
            - shell
          require_approval: []
          request_token_budget: 10000
          monthly_cost_budget_cents: 10000
        channels:
          - binding_id: demo-http
            type: http
            provider_account_id: local-development
            enabled: true
          - binding_id: demo-wecom
            type: wecom
            provider_account_id: replace-with-wecom-corp-id
            provider_app_id: "1000002"
            webhook_url: https://example.invalid/channels/wecom/demo-wecom
            token:
              provider: env
              key: WECOM_CALLBACK_TOKEN
            secret:
              provider: env
              key: WECOM_APP_SECRET
            encryption_key:
              provider: env
              key: WECOM_ENCODING_AES_KEY
            enabled: false
          # 飞书 Adapter 与 Sender 已由 PR10 交付；此处默认 disabled，填入真实
          # App ID 并通过 Admin API 发布新版本即可启用，无需重启。
          - binding_id: demo-feishu
            type: feishu
            provider_account_id: replace-with-feishu-app-id
            token:
              provider: env
              key: FEISHU_VERIFICATION_TOKEN
            secret:
              provider: env
              key: FEISHU_APP_SECRET
            encryption_key:
              provider: env
              key: FEISHU_ENCRYPT_KEY
            enabled: false
        storage:
          session:
            type: postgres
            endpoint: postgres://postgres:5432/trpc_agent
            namespace: demo-assistant
            # During a controlled PR12 migration, publish a new config version
            # with migration_target on both session and summary. The credential
            # SecretRef resolves to a complete target DSN; never put it inline.
            # migration_target:
            #   type: postgres
            #   endpoint: postgres://target-postgres:5432/trpc_agent
            #   credential: {provider: env, key: TRPC_AGENT_STORAGE_TARGET_DSN}
          memory:
            type: postgres
            endpoint: postgres://postgres:5432/trpc_agent
          summary:
            type: postgres
            endpoint: postgres://postgres:5432/trpc_agent
          artifact:
            type: postgres
            endpoint: postgres://postgres:5432/trpc_agent
          knowledge:
            type: postgres
            endpoint: postgres://postgres:5432/trpc_agent
          audit:
            type: postgres
            endpoint: postgres://postgres:5432/trpc_agent
